apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-mongo-deployment
  labels:
    app: payment-mongo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-mongo
  template:
    metadata:
      labels:
        app: payment-mongo
    spec:
      containers:
        - name: payment-mongo
          image: mongo:8.0
          ports:
            - containerPort: 27017

          volumeMounts:
            - mountPath: /data/db
              name: mongodb-data

          env:
            - name: MONGO_INITDB_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: payment-configmap
                  key: DB_NAME
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: payment-secret
                  key: DB_USERNAME
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: payment-secret
                  key: DB_PASSWORD
      volumes:
        - name: mongodb-data
          persistentVolumeClaim:
            claimName: payment-mongo-pvc