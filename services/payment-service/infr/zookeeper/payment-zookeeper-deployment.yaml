apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-zookeeper-deployment
  labels:
    app: payment-zookeeper
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-zookeeper
  template:
    metadata:
      labels:
        app: payment-zookeeper
    spec:
      containers:
        - name: payment-zookeeper
          image: confluentinc/cp-zookeeper:7.6.1
          ports:
            - containerPort: 2181
          volumeMounts:
            - mountPath: /var/lib/zookeeper/data
              name: zookeeper-data
          env:
            - name: ZOOKEEPER_CLIENT_PORT
              valueFrom:
                configMapKeyRef:
                  name: payment-configmap
                  key: ZOOKEEPER_CLIENT_PORT
            - name: ZOOKEEPER_TICK_TIME
              valueFrom:
                configMapKeyRef:
                  name: payment-configmap
                  key: ZOOKEEPER_TICK_TIME

      volumes:
        - name: zookeeper-data
          persistentVolumeClaim:
            claimName: payment-zookeeper-pvc