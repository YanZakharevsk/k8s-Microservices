apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-kafka-deployment
  labels:
    app: payment-kafka
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-kafka
  template:
    metadata:
      labels:
        app: payment-kafka
    spec:
      containers:
        - name: payment-kafka
          image: confluentinc/cp-kafka:7.6.1
          ports:
            - containerPort: 29092
          volumeMounts:
            - mountPath: /var/lib/kafka/data
              name: kafka-data

          env:
            - name: KAFKA_BROKER_ID
              valueFrom:
                configMapKeyRef:
                  name: payment-configmap
                  key: KAFKA_BROKER_ID
            - name: KAFKA_ZOOKEEPER_CONNECT
              valueFrom:
                configMapKeyRef:
                  name: payment-configmap
                  key: KAFKA_ZOOKEEPER_CONNECT
            - name: KAFKA_ADVERTISED_LISTENERS
              valueFrom:
                configMapKeyRef:
                  name: payment-configmap
                  key: KAFKA_ADVERTISED_LISTENERS
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              valueFrom:
                configMapKeyRef:
                  name: payment-configmap
                  key: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              valueFrom:
                configMapKeyRef:
                  name: payment-configmap
                  key: KAFKA_INTER_BROKER_LISTENER_NAME
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              valueFrom:
                configMapKeyRef:
                  name: payment-configmap
                  key: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              valueFrom:
                configMapKeyRef:
                  name: payment-configmap
                  key: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              valueFrom:
                configMapKeyRef:
                  name: payment-configmap
                  key: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR

      volumes:
        - name: kafka-data
          persistentVolumeClaim:
            claimName: payment-kafka-pvc

