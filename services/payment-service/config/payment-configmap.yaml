apiVersion: v1
kind: ConfigMap
metadata:
  name: payment-configmap

data:
  SERVER_PORT: "8084"
  SPRING_PROFILES_ACTIVE: "docker"

  DB_NAME: "payment_db"
  MONGODB_URL: "mongodb://payment-mongo-service:27017/payments-db"
  MONGO_HOST: "payment-mongo-service"

  RANDOM_NUMBER_API_URL: "https://www.random.org/integers/?num=1&min=1&max=100&col=1&base=10&format=plain&rnd=new"
  RANDOM_NUMBER_API_MIN: "1"
  RANDOM_NUMBER_API_MAX: "50"
  RANDOM_NUMBER_API_NUMBER_COUNT: "1"

  ZOOKEEPER_CLIENT_PORT: "2181"
  ZOOKEEPER_TICK_TIME: "2000"

  DOCKER_SPRING_KAFKA_BOOTSTRAP_SERVERS: "payment-kafka-service:29092"
  SPRING_KAFKA_CONSUMER_GROUP_ID: "payment-service-group"
  SPRING_KAFKA_CONSUMER_AUTO_OFFSET_RESET: "earliest"
  SPRING_KAFKA_CONSUMER_KEY_DESERIALIZER: "org.apache.kafka.common.serialization.StringDeserializer"
  SPRING_KAFKA_CONSUMER_VALUE_DESERIALIZER: "org.springframework.kafka.support.serializer.JsonDeserializer"
  SPRING_KAFKA_CONSUMER_PROPERTIES_SPRING_JSON_TRUSTED_PACKAGES: "*"

  KAFKA_BROKER_ID: "1"
  KAFKA_ZOOKEEPER_CONNECT: "payment-zookeeper-service:2181"
  KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT_INTERNAL://payment-kafka-service:29092"
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT_INTERNAL:PLAINTEXT"
  KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT_INTERNAL"
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
