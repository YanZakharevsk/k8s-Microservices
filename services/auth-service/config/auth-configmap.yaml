apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-configmap

data:
  SERVER_PORT: "8082"
  SPRING_PROFILES_ACTIVE: "docker"
  DOCKER_DB_URL: "jdbc:postgresql://auth-postgres-service:5432/auth-service"
  DB_NAME: "auth-service"
  DB_HOST: "auth-postgres-service"
  JWT_ACCESS_EXPIRE_MS: "900000"
  JWT_REFRESH_EXPIRE_MS: "86400000"