apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service-postgres-deployment
  labels:
    app: user-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-postgres
  template:
    metadata:
      labels:
        app: user-postgres
    spec:
      containers:
        - name: user-postgres
          image: postgres:17
          ports:
            - containerPort: 5432

          volumeMounts:
            - mountPath: /var/lib/postgresql/data
              name: user-postgres-data
              subPath: pgdata

          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: user-service-configmap
                  key: DB_NAME
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: user-service-secret
                  key: DB_USERNAME
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: user-service-secret
                  key: DB_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata

      volumes:
        - name: user-postgres-data
          persistentVolumeClaim:
            claimName: user-service-postgres-pvc