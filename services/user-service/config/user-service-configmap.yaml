apiVersion: v1
kind: ConfigMap
metadata:
  name: user-service-configmap

data:
  SERVER_PORT: "8081"
  SPRING_PROFILES_ACTIVE: "docker"
  DOCKER_DB_URL: "jdbc:postgresql://user-service-postgres-service:5432/user-service"
  DB_NAME: "user-service"
  REDIS_TIMEOUT: "60000"
  DB_HOST: "user-service-postgres-service"
  REDIS_HOST: "user-service-redis-service"
  REDIS_PORT: "6379"