apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-postgres-deployment
  labels:
    app: order-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-postgres
  template:
    metadata:
      labels:
        app: order-postgres
    spec:
      containers:
        - name: order-postgres
          image: postgres:17
          ports:
            - containerPort: 5432

          volumeMounts:
            - mountPath: /var/lib/postgresql/data
              name: order-postgres-data
              subPath: pgdata

          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: order-configmap
                  key: DB_NAME
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: order-secret
                  key: DB_USERNAME
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: order-secret
                  key: DB_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata

      volumes:
        - name: order-postgres-data
          persistentVolumeClaim:
            claimName: order-postgres-pvc